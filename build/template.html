<html lang="ja">

<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--ink:#1f2328;--sub:#5b6470;--line:#dde2e8;
  --main:#0075C2;--main-ink:#ffffff;--accent:#009FB9;--soft:#e8f2fa;
  --ok:#00A73C;--mid:#C98A00;--ng:#E0524D;--chip:#eef1f5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171b;--card:#1d2126;--ink:#e8eaed;--sub:#a3abb5;--line:#323840;
    --main:#4aa3e0;--main-ink:#0b1520;--accent:#3cc3d8;--soft:#1f2e3b;
    --ok:#3cc56b;--mid:#e0a92e;--ng:#f07a75;--chip:#2a3038;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b;--card:#1d2126;--ink:#e8eaed;--sub:#a3abb5;--line:#323840;
  --main:#4aa3e0;--main-ink:#0b1520;--accent:#3cc3d8;--soft:#1f2e3b;
  --ok:#3cc56b;--mid:#e0a92e;--ng:#f07a75;--chip:#2a3038;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Sans","Yu Gothic UI","游ゴシック","Yu Gothic",Meiryo,Arial,sans-serif;line-height:1.65;font-size:16px;
  -webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
header.top h1{font-size:19px;margin:0;color:var(--main);letter-spacing:.02em}
header.top .ver{font-size:12px;color:var(--sub);text-align:right}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button:disabled{opacity:.45;cursor:default}
.btn-main{background:var(--main);color:var(--main-ink);border-color:var(--main);font-weight:700}
.btn-big{width:100%;font-size:18px;padding:16px}
.btn-link{border:none;background:none;color:var(--main);padding:6px 4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.box h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--main)}
.stat span{font-size:12px;color:var(--sub)}
.chip{display:inline-block;font-size:12px;background:var(--chip);color:var(--sub);border-radius:999px;padding:2px 10px;margin:0 4px 4px 0}
.chip.new{background:var(--accent);color:#fff}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.bar i.ok{background:var(--ok)}
.fieldrow{display:grid;grid-template-columns:1fr 3.5em;gap:2px 8px;align-items:center;font-size:13px;margin:8px 0}
.fieldrow .bar{grid-column:1 / 3;grid-row:2}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.nav button{padding:14px 8px}
/* 学習カード */
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.progress .bar{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin:12px 0;min-height:42vh;display:flex;flex-direction:column}
.card .ask{font-size:13px;color:var(--sub);margin-bottom:6px}
.card .front{font-size:23px;font-weight:700;line-height:1.5;margin:8px 0 4px}
.card .front.long{font-size:19px;font-weight:600}
.answer{border-top:2px solid var(--main);margin-top:14px;padding-top:12px}
.answer .main{font-size:19px;font-weight:700;color:var(--main);line-height:1.55}
.detail dt{font-size:12px;color:var(--sub);margin-top:12px;font-weight:700}
.detail dd{margin:2px 0 0}
.detail ul{margin:2px 0 0;padding-left:1.2em}
.detail li{margin:2px 0}
.pt{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.pt b{white-space:nowrap}
.src{font-size:12px;color:var(--sub)}
.src a{color:var(--main)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;bottom:0;margin-top:8px;padding:8px 0;background:var(--bg)}
.grades button{background:var(--card)}
.grades button{padding:14px 4px;font-weight:700;font-size:15px}
.g1{border-color:var(--ng);color:var(--ng)}
.g2{border-color:var(--mid);color:var(--mid)}
.g3{border-color:var(--ok);color:var(--ok)}
.reveal{position:sticky;bottom:8px;margin-top:8px}
.kbd{font-size:11px;color:var(--sub);font-weight:400;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600}
td.n{text-align:right}
input[type=search],select,input[type=number]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label.opt{display:flex;align-items:center;gap:8px;padding:8px 0}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.badge{font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--chip);color:var(--sub)}
.badge.l{background:var(--soft);color:var(--main)}
.badge.m{background:var(--ok);color:#fff}
.notice{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
footer{font-size:11px;color:var(--sub);margin-top:24px;line-height:1.6}
footer a{color:var(--sub)}
.pair{display:grid;grid-template-columns:1fr;gap:8px}
.pair .side{background:var(--soft);border-radius:12px;padding:12px}
.pair .side b{color:var(--main)}
@media (min-width:600px){.pair{grid-template-columns:1fr 1fr}}
/* ドリル・模擬試験 */
.qtext{font-size:17px;font-weight:600;line-height:1.6;margin:8px 0 4px;white-space:pre-wrap}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;width:100%;line-height:1.5}
.choice .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--sub);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.choice.sel{border-color:var(--main);background:var(--soft)}
.choice.ok{border-color:var(--ok);border-width:2px}
.choice.ok .n{background:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);border-width:2px}
.choice.ng .n{background:var(--ng);color:#fff}
.choice:disabled{opacity:1}
.expl{background:var(--soft);border-radius:12px;padding:12px;margin-top:12px;font-size:14px;white-space:pre-wrap}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.pal button{padding:6px 0;font-size:12px;border-radius:8px}
.pal button.done{background:var(--soft);color:var(--main);font-weight:700}
.pal button.flag{border-color:var(--mid);border-width:2px}
.pal button.cur{outline:2px solid var(--main)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.warn{color:var(--ng)}
.keypts{margin:10px 0 0;padding-left:1.2em}
.keypts li{margin:4px 0}
.keypts b{color:var(--main)}
details.more{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--main);font-size:14px}
.big-score{font-size:42px;font-weight:700;line-height:1.2}
.okc{color:var(--ok)}.ngc{color:var(--ng)}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1 data-act="home" style="cursor:pointer">診療報酬100</h1>
    <div class="ver" id="ver"></div>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>
<script>
"use strict";
const DATA = __DATA__;
const META = DATA.meta, ITEMS = DATA.items, SRC = DATA.sources;
const BY_ID = Object.fromEntries(ITEMS.map(x => [x.id, x]));
const FIELDS = META.fields;
const KEY = "shinryo100-v1";
const INTERVAL = [0, 1, 3, 7, 16, 35];   // 段階（box）ごとの次回までの日数
const MASTER_BOX = 4;                    // この段階以上を「定着」とみなす
const GRADE_LABEL = {1: "言えなかった", 2: "あいまい", 3: "言えた"};

// ---------- 保存 ----------
function fresh() {
  return {v: 1, settings: {newPerDay: 4, pointCards: false}, cards: {}, intro: {}, log: [], daily: {}, tests: [], q: {}, drills: [], exams: []};
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    const s = JSON.parse(raw);
    return Object.assign(fresh(), s, {settings: Object.assign(fresh().settings, s.settings || {})});
  } catch (e) { return fresh(); }
}
let S = load();
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; alert("学習記録を保存できませんでした。プライベートブラウズを使っていないか確認してください。"); } }
}

// ---------- 日付 ----------
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); }
function md(s) { const [, m, d] = s.split("-"); return Number(m) + "/" + Number(d); }

// ---------- 小道具 ----------
const $ = sel => document.querySelector(sel);
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function itemOf(cid) { return BY_ID[cid.split(":")[0]]; }
function typeOf(cid) { return cid.split(":")[1]; }
function fmtPoint(p) {
  if (typeof p.value === "number") return p.value.toLocaleString() + (p.unit || "点");
  if (typeof p.min === "number") return p.min.toLocaleString() + "〜" + p.max.toLocaleString() + (p.unit || "点");
  return p.text || "";
}
function scaleNote(it) {
  const p = (it.points || []).find(p => typeof p.value === "number" && p.per === "1日につき");
  if (!p) return "";
  const yen = p.value * 10, year = yen * 50 * 0.9 * 365;
  return "1床1日 " + yen.toLocaleString() + "円。50床の病棟・稼働率90%なら年 約" + (year / 1e8).toFixed(1) + "億円（" + esc(p.label) + "のみの概算）";
}

// ---------- 項目の学習状況 ----------
function itemLevel(it) {
  const n = S.cards[it.id + ":N"], s = S.cards[it.id + ":S"];
  if (!n) return 0;                                   // 未学習
  if (n.box >= MASTER_BOX && s && s.box >= MASTER_BOX) return 2;   // 定着
  return 1;                                           // 学習中
}
const LEVEL_LABEL = ["未学習", "学習中", "定着"];

// 期限が来たカード。同じ項目のカードが複数あるときは、前回から一番間が空いたものだけを出す
// （名称→概要と概要→名称を同じ日に出すと、片方がもう片方の答えになってしまうため）。
function dueCards(day) {
  const best = {};
  for (const [cid, st] of Object.entries(S.cards)) {
    const it = itemOf(cid);
    if (!it) continue;                                // 廃止・未公開の項目
    if (typeOf(cid) === "P" && !S.settings.pointCards) continue;
    if (st.due > day) continue;
    const cur = best[it.id];
    const older = !cur || (st.last || "") < (S.cards[cur].last || "") || ((st.last || "") === (S.cards[cur].last || "") && typeOf(cid) === "S");
    if (older) best[it.id] = cid;
  }
  return Object.values(best);
}
function introducedOn(day) { return Object.values(S.intro).filter(d => d === day).length; }
function nextNewItems(day) {
  const room = Math.max(0, S.settings.newPerDay - introducedOn(day));
  return ITEMS.filter(it => !S.cards[it.id + ":N"]).slice(0, room);
}
function nextPointCards() {
  if (!S.settings.pointCards) return [];
  return ITEMS.filter(it => S.cards[it.id + ":N"] && S.cards[it.id + ":N"].box >= 2 && !S.cards[it.id + ":P"])
    .slice(0, 4).map(it => it.id + ":P");
}

// 復習カードをばらばらに並べ、新規カードを等間隔に差し込む。同じ項目のカードが続かないようにする。
function buildQueue() {
  const day = today();
  const rev = shuffle(dueCards(day));
  const fresh = nextNewItems(day).map(it => it.id + ":N").concat(nextPointCards());
  const q = rev.slice();
  if (fresh.length) {
    const step = Math.max(1, Math.floor((q.length + fresh.length) / fresh.length));
    fresh.forEach((cid, i) => q.splice(Math.min(q.length, i * step + Math.floor(step / 2)), 0, cid));
  }
  for (let i = 1; i < q.length; i++) {
    if (itemOf(q[i]).id === itemOf(q[i - 1]).id) {
      const j = q.findIndex((c, k) => k > i && itemOf(c).id !== itemOf(q[i - 1]).id);
      if (j > 0) [q[i], q[j]] = [q[j], q[i]];
    }
  }
  return q;
}

// ---------- セッション ----------
let SES = null;
function startStudy() {
  const q = buildQueue();
  if (!q.length) return render();
  SES = {mode: "study", queue: q, idx: 0, shown: false, t0: Date.now(), cardT0: Date.now(), res: [], again: {}, done: {}};
  render();
}
function startTest(opt) {
  let pool = ITEMS.filter(it => opt.field === "ALL" || it.field === opt.field);
  if (opt.learnedOnly) { const l = pool.filter(it => itemLevel(it) > 0); if (l.length) pool = l; }
  if (!pool.length) return;
  if (opt.order === "weak") {
    const score = it => { const n = S.cards[it.id + ":N"] || {}, s = S.cards[it.id + ":S"] || {}; return (n.lapses || 0) + (s.lapses || 0) + (testMiss[it.id] || 0) * 2 - (n.box || 0) * 0.1 + Math.random() * 0.5; };
    pool = pool.slice().sort((a, b) => score(b) - score(a));
  } else pool = shuffle(pool.slice());
  pool = pool.slice(0, opt.count);
  const q = pool.map(it => it.id + ":" + (opt.kind === "MIX" ? (Math.random() < .5 ? "N" : "S") : opt.kind));
  SES = {mode: "test", queue: q, idx: 0, shown: false, t0: Date.now(), cardT0: Date.now(), res: [], again: {}, done: {}, opt};
  render();
}
let testMiss = {};
function rebuildTestMiss() { testMiss = {}; for (const t of S.tests) for (const id of (t.miss || [])) testMiss[id] = (testMiss[id] || 0) + 1; }

function grade(g) {
  if (!SES || !SES.shown) return;
  const cid = SES.queue[SES.idx];
  const sec = Math.min(300, Math.round((Date.now() - SES.cardT0) / 1000));
  const day = today();
  SES.res.push({cid, g});
  if (SES.mode === "study") {
    const first = !SES.done[cid];
    if (first) {
      SES.done[cid] = true;
      const st = S.cards[cid];
      const isNew = !st;
      const c = st || {box: 0, reps: 0, lapses: 0};
      if (g === 3) c.box = Math.min(c.box + 1, 5);
      else if (g === 2) c.box = Math.max(c.box, 1);
      else { if (c.box >= 2) c.lapses++; c.box = 1; }
      c.reps++; c.last = day; c.due = addDays(day, INTERVAL[c.box]);
      S.cards[cid] = c;
      if (isNew && typeOf(cid) === "N") {
        const it = itemOf(cid);
        S.intro[it.id] = day;
        if (!S.cards[it.id + ":S"]) S.cards[it.id + ":S"] = {box: 0, reps: 0, lapses: 0, due: addDays(day, 1)};   // 逆向きのカードは翌日から
      }
      const dd = S.daily[day] || (S.daily[day] = {n: 0, ok: 0, new: 0, rev: 0, sec: 0});
      dd.n++; if (g === 3) dd.ok++; if (isNew) dd.new++; else dd.rev++; dd.sec += sec;
    }
    S.log.push([new Date().toISOString().slice(0, 19), cid, g, sec]);
    if (S.log.length > 20000) S.log.splice(0, S.log.length - 20000);
    if (g === 1 && (SES.again[cid] || 0) < 2) { SES.again[cid] = (SES.again[cid] || 0) + 1; SES.queue.push(cid); }
    save();
  }
  SES.idx++; SES.shown = false; SES.cardT0 = Date.now();
  if (SES.idx >= SES.queue.length) finish(); else render();
  window.scrollTo(0, 0);
}
function finish() {
  if (SES.mode === "test") {
    const first = {};
    for (const r of SES.res) if (!(r.cid in first)) first[r.cid] = r.g;
    const ok = Object.values(first).filter(g => g === 3).length;
    const miss = Object.entries(first).filter(([, g]) => g !== 3).map(([c]) => itemOf(c).id);
    S.tests.push({d: today(), n: Object.keys(first).length, ok, field: SES.opt.field, miss});
    if (S.tests.length > 200) S.tests.splice(0, S.tests.length - 200);
    rebuildTestMiss(); save();
  }
  SES.finished = true; render();
}
function quit() { if (SES && SES.mode === "study" && SES.res.length) { SES.finished = true; render(); } else { SES = null; render(); } }

// ---------- 画面 ----------
let VIEW = "home", VIEWARG = null;
function go(v, arg) { VIEW = v; VIEWARG = arg == null ? null : arg; SES = v === "home" ? null : SES; render(); window.scrollTo(0, 0); }

function render() {
  $("#ver").innerHTML = esc(META.fyLabel) + "版 ・ 更新 " + esc(META.dataVersion) + "<br>出題中 " + META.activeItems + " / " + META.totalItems + " 項目";
  const app = $("#app");
  if (SES && SES.finished) app.innerHTML = viewDone();
  else if (SES) app.innerHTML = viewCard();
  else app.innerHTML = ({home: viewHome, progress: viewProgress, list: viewList, detail: viewDetail, compare: viewCompare, drill: viewDrill, exam: viewExam, settings: viewSettings}[VIEW] || viewHome)();
  if (VIEW === "list" && !SES) { const q = $("#q"); if (q) { q.value = LISTQ; } }
}

function streak() {
  let d = today(), n = 0;
  if (!(S.daily[d] && S.daily[d].n)) d = addDays(d, -1);
  while (S.daily[d] && S.daily[d].n) { n++; d = addDays(d, -1); }
  return n;
}

function viewHome() {
  const day = today();
  const rev = dueCards(day).length;
  const nw = nextNewItems(day).length;
  const pc = nextPointCards().length;
  const td = S.daily[day];
  const learned = ITEMS.filter(it => itemLevel(it) > 0).length;
  const tomorrow = dueCards(addDays(day, 1)).length;
  const qs = ITEMS.reduce((a, it) => { const s = qStat(it.id); a.n += s.n; a.ok += s.ok; return a; }, {n: 0, ok: 0});
  const weakN = ITEMS.filter(it => missOf(it.id) > 0).length;
  // ドリル（メイン）
  let h = '<div class="box"><h2>ドリル</h2>';
  h += '<div class="grid3"><div class="stat"><b>' + qs.n + '</b><span>解いた問題</span></div><div class="stat"><b>' + (qs.n ? pct(qs.ok, qs.n) + '%' : '—') + '</b><span>正答率</span></div><div class="stat"><b>' + weakN + '</b><span>間違えた項目</span></div></div>';
  h += '<p style="margin:14px 0 0"><button class="btn-main btn-big" data-act="dquick" data-o="random">10問ドリルを始める<span class="kbd" style="color:inherit;opacity:.85">全分野・ランダム</span></button></p>';
  h += '<div class="grid2" style="margin-top:8px"><button data-act="dquick" data-o="weak"' + (weakN ? '' : ' disabled') + '>苦手から10問</button><button data-act="go" data-v="drill">分野・形式を選ぶ</button></div>';
  if (qs.n) {
    h += '<div style="margin-top:12px">';
    for (const [k, f] of Object.entries(FIELDS)) {
      const st = ITEMS.filter(it => it.field === k).reduce((a, it) => { const s = qStat(it.id); a.n += s.n; a.ok += s.ok; return a; }, {n: 0, ok: 0});
      h += '<div class="fieldrow"><span>' + esc(f.label) + '</span><span class="muted" style="text-align:right">' + (st.n ? pct(st.ok, st.n) + '%' : '—') + '</span><div class="bar"><i class="' + (st.n && pct(st.ok, st.n) >= 80 ? 'ok' : '') + '" style="width:' + (st.n ? pct(st.ok, st.n) : 0) + '%"></i></div></div>';
    }
    h += '<p class="muted" style="margin:4px 0 0">分野別の正答率（緑は80%以上）</p></div>';
  }
  h += '</div>';
  // 模擬試験
  const lastEx = S.exams[S.exams.length - 1];
  h += '<div class="box"><h2>模擬試験</h2><p class="muted" style="margin-top:0">全分野から' + EXAM_TOTAL + '問・' + EXAM_MIN + '分。合格ラインは80%（' + EXAM_PASS + '問）です。</p>';
  if (lastEx) h += '<p class="muted">直近の結果：' + md(lastEx.d) + ' ' + lastEx.score + ' / ' + lastEx.total + '問（' + (lastEx.pass ? '<span class="okc">合格ライン到達</span>' : '<span class="ngc">合格ラインまであと' + (EXAM_PASS - lastEx.score) + '問</span>') + '）</p>';
  h += '<button class="btn-main" style="width:100%" data-act="go" data-v="exam">模擬試験を受ける</button></div>';
  // 今日の一問一答（サブ）
  h += '<div class="box"><h2>今日の一問一答</h2><p class="muted" style="margin-top:0">名称と概要を思い出す練習です。忘れかけたころに復習カードが出ます。</p>';
  h += '<div class="row" style="justify-content:space-between"><span>復習 <b>' + rev + '</b>枚・新しい項目 <b>' + nw + '</b>' + (pc ? '・点数カード <b>' + pc + '</b>枚' : '') + '</span><span class="muted">学習済み ' + learned + ' / ' + ITEMS.length + '</span></div>';
  if (rev + nw + pc > 0) h += '<p style="margin:10px 0 0"><button style="width:100%" data-act="start">一問一答を始める</button></p>';
  else h += '<p class="notice">今日の分は終わりました。明日の復習は ' + tomorrow + ' 枚です。</p>';
  if (td && td.n) h += '<p class="muted">今日は ' + td.n + ' 枚に答えました（言えた ' + pct(td.ok, td.n) + '%）。連続 ' + streak() + '日。</p>';
  h += '</div>';
  h += '<div class="nav"><button data-act="go" data-v="list">項目一覧</button><button data-act="go" data-v="progress">成績</button></div>';
  h += '<p style="text-align:center"><button class="btn-link" data-act="go" data-v="settings">設定・バックアップ</button></p>';
  return h;
}

function detailHTML(it, opt) {
  opt = opt || {};
  let h = '<dl class="detail">';

  h += '<dt>点数</dt><dd>' + it.points.map(p => '<div class="pt"><span>' + esc(p.label) + (p.note ? '<br><span class="muted">' + esc(p.note) + '</span>' : '') + '</span><b>' + esc(fmtPoint(p)) + (p.per ? '<span class="muted">／' + esc(p.per) + '</span>' : '') + '</b></div>').join("");
  const sc = scaleNote(it); if (sc) h += '<div class="muted" style="margin-top:4px">規模の目安：' + sc + '</div>';
  h += '</dd>';

  if (it.hook) h += '<dt>覚え方</dt><dd>' + esc(it.hook) + '</dd>';

}

function viewDone() {

function viewProgress() {

    const its = ITEMS.filter(it => it.field === k);
    const l = its.filter(it => itemLevel(it) > 0).length, m = its.filter(it => itemLevel(it) === 2).length;
    const lg = recent.filter(x => x[1].startsWith(k + "-"));
    h += '<tr><td>' + esc(f.label) + '</td><td class="n">' + its.length + '</td><td class="n">' + l + '</td><td class="n">' + m + '</td><td class="n">' + (lg.length ? pct(lg.filter(x => x[2] === 3).length, lg.length) + '%' : '—') + '</td></tr>';
  }

    const n = S.cards[it.id + ":N"] || {}, s = S.cards[it.id + ":S"] || {};

    return {it, score: (n.lapses || 0) + (s.lapses || 0) + lastBad + (testMiss[it.id] || 0) + missOf(it.id)};
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 10);
  h += '<div class="box"><h2>復習が必要な項目</h2>' + (weak.length ? weak.map(x => '<div class="item" data-act="detail" data-id="' + x.it.id + '"><span>' + esc(x.it.name) + '</span><span class="badge">' + LEVEL_LABEL[itemLevel(x.it)] + '</span></div>').join("") : '<p class="muted">まだありません。「言えなかった」を選んだ項目やテストで間違えた項目がここに出ます。</p>') + '</div>';
  h += '<div class="box"><h2>直近14日の記録</h2><table><tr><th>日付</th><th class="n">新規</th><th class="n">復習</th><th class="n">言えた率</th><th class="n">分</th></tr>';
  let any = false;
  for (let i = 0; i < 14; i++) {
    const d = addDays(day, -i), x = S.daily[d];
    if (!x) continue; any = true;
    h += '<tr><td>' + md(d) + '</td><td class="n">' + x.new + '</td><td class="n">' + x.rev + '</td><td class="n">' + pct(x.ok, x.n) + '%</td><td class="n">' + Math.max(1, Math.round(x.sec / 60)) + '</td></tr>';
  }
  if (!any) h += '<tr><td colspan="5" class="muted">まだ記録がありません</td></tr>';
  h += '</table></div>';
  const qs = ITEMS.reduce((a, it) => { const s = qStat(it.id); a.n += s.n; a.ok += s.ok; return a; }, {n: 0, ok: 0});
  h += '<div class="box"><h2>ドリル・模擬試験の正答率</h2><p class="muted" style="margin-top:0">これまでに解いた四択問題 ' + qs.n + '問、正答率 ' + (qs.n ? pct(qs.ok, qs.n) + '%' : '—') + '</p><table><tr><th>分野</th><th class="n">解いた数</th><th class="n">正答率</th></tr>';
  for (const [k, f] of Object.entries(FIELDS)) {
    const st = ITEMS.filter(it => it.field === k).reduce((a, it) => { const s = qStat(it.id); a.n += s.n; a.ok += s.ok; return a; }, {n: 0, ok: 0});
    h += '<tr><td>' + esc(f.label) + '</td><td class="n">' + st.n + '</td><td class="n">' + (st.n ? pct(st.ok, st.n) + '%' : '—') + '</td></tr>';
  }
  h += '</table></div>';
  if (S.exams.length) h += '<div class="box"><h2>模擬試験の記録</h2><table><tr><th>日付</th><th class="n">得点</th><th>判定</th></tr>' + S.exams.slice(-10).reverse().map(x => '<tr><td>' + md(x.d) + '</td><td class="n">' + x.score + ' / ' + x.total + '</td><td>' + (x.pass ? '<span class="okc">合格ライン到達</span>' : '<span class="ngc">あと' + (EXAM_PASS - x.score) + '問</span>') + '</td></tr>').join("") + '</table></div>';
  if (S.tests.length) h += '<div class="box"><h2>理解度テストの記録</h2><table><tr><th>日付</th><th>範囲</th><th class="n">正答</th></tr>' + S.tests.slice(-8).reverse().map(t => '<tr><td>' + md(t.d) + '</td><td>' + esc(t.field === "ALL" ? "全分野" : FIELDS[t.field].label) + '</td><td class="n">' + t.ok + ' / ' + t.n + '</td></tr>').join("") + '</table></div>';
  return h;
}

function pairs() {
  const seen = new Set(), out = [];
  for (const it of ITEMS) for (const s of it.similar || []) {
    if (!BY_ID[s.id]) continue;
    const k = [it.id, s.id].sort().join("+");
    if (seen.has(k)) continue; seen.add(k); out.push(k.split("+"));
  }
  return out;
}
let CMP = null;
function viewCompare() {
  const ps = pairs();
  let h = '<div class="row"><button class="btn-link" data-act="home">← ホーム</button></div>';
  if (!ps.length) return h + '<div class="box"><p class="muted">比較できる組合せがまだありません。</p></div>';
  if (!CMP) CMP = {i: Math.floor(Math.random() * ps.length), shown: false};
  const [a, b] = ps[CMP.i % ps.length].map(id => BY_ID[id]);
  const diff = (x, y) => (x.similar || []).find(s => s.id === y.id);
  h += '<div class="card" style="min-height:auto"><div class="ask">2つの違いを説明できますか（' + (CMP.i % ps.length + 1) + ' / ' + ps.length + '組）</div>';
  h += '<div class="pair"><div class="side"><b>' + esc(a.name) + '</b><div class="muted">' + esc(a.kubun) + '</div></div><div class="side"><b>' + esc(b.name) + '</b><div class="muted">' + esc(b.kubun) + '</div></div></div>';
  if (CMP.shown) {
    h += '<div class="answer"><div class="pair"><div class="side"><b>' + esc(a.name) + '</b><div>' + esc(a.summary) + '</div></div><div class="side"><b>' + esc(b.name) + '</b><div>' + esc(b.summary) + '</div></div></div><dl class="detail"><dt>違い</dt><dd><ul>';
    const d1 = diff(a, b), d2 = diff(b, a);
    if (d1) h += '<li>' + esc(d1.diff) + '</li>';
    if (d2) h += '<li>' + esc(d2.diff) + '</li>';
    h += '</ul></dd></dl></div>';
  }
  h += '</div>';
  h += CMP.shown ? '<div class="grid2"><button data-act="cmpdetail" data-id="' + a.id + '">' + esc(a.name) + 'を詳しく</button><button data-act="cmpdetail" data-id="' + b.id + '">' + esc(b.name) + 'を詳しく</button></div><p><button class="btn-main btn-big" data-act="cmpnext">次の組合せ</button></p>' : '<div class="reveal"><button class="btn-main btn-big" data-act="cmpshow">違いを見る</button></div>';
  return h;
}

  h += '<div class="box"><h2>このアプリについて</h2><p class="muted">「今日の一問一答」は、名称→概要、概要→名称の両方向で思い出す練習をし、思い出せた度合いに応じて次に出す日を決めます（1日→3日→7日→16日→35日。言えなかったカードは翌日に戻ります）。「ドリル」と「模擬試験」は四択問題で、点数・基準・日数などの要点と、名称と説明の対応を確かめます。</p></div>';
  return h;
}

// ---------- カードの要点 ----------
function keyPointsHTML(it, t) {
  const fs = (it.facts || []).slice(0, 3);
  const main = (it.points || [])[0];
  let h = '<ul class="keypts">';
  if (t === "N" && it.aliases && it.aliases.length) h += '<li>通称：' + esc(it.aliases.join("、")) + '</li>';

}

// ---------- 四択問題の作成 ----------
const KIND_LABEL = {fact: "要点", n2s: "名称→説明", s2n: "説明→名称"};
const EXAM_N = {NY: 13, KS: 15, RH: 7, ZT: 8, GK: 7};   // 模擬試験 50問の分野配分（項目数の比率）
const EXAM_TOTAL = 50, EXAM_PASS = 40, EXAM_MIN = 40;    // 合格ライン80%、制限時間40分
// 似た項目 → 同じ分野 → ほかの分野 の順に、正解と違う選択肢を集める
function pickOthers(it, n, key) {
  const sim = shuffle((it.similar || []).map(s => BY_ID[s.id]).filter(Boolean));
  const same = shuffle(ITEMS.filter(x => x.field === it.field && x.id !== it.id));
  const rest = shuffle(ITEMS.filter(x => x.field !== it.field));
  const out = [], seen = new Set([key(it)]);
  for (const x of sim.concat(same, rest)) {
    const v = key(x);
    if (!v || seen.has(v)) continue;
    seen.add(v); out.push(v);
    if (out.length >= n) break;
  }
  return out;
}
function makeQ(it, kind) {
  let q, ans, wrong, e, sub = "";
  if (kind === "fact" && it.facts && it.facts.length) {
    const f = it.facts[Math.floor(Math.random() * it.facts.length)];
    q = "【" + it.name + "】\n" + f.q; ans = f.a; wrong = f.x.slice(); sub = f.q;
    e = "正解：" + f.a + "\n\n" + it.name + "は、" + it.summary;
  } else if (kind === "s2n") {
    q = "次の説明にあてはまるものは？\n「" + it.summary + "」"; ans = it.name; wrong = pickOthers(it, 3, x => x.name);
    e = "正解：" + it.name + (it.hook ? "\n\n覚え方：" + it.hook : "");
  } else {
    kind = "n2s";
    q = "「" + it.name + "」の説明として正しいものは？"; ans = it.summary; wrong = pickOthers(it, 3, x => x.summary);
    e = "正解：" + it.summary + (it.hook ? "\n\n覚え方：" + it.hook : "");
  }
  const c = shuffle([ans].concat(wrong.slice(0, 3)));
  return {id: it.id, field: it.field, kind: kind, key: it.id + ":" + kind + ":" + sub, q: q, c: c, a: c.indexOf(ans), e: e};
}
function pickKind(pref) {
  if (pref && pref !== "MIX") return pref;
  const r = Math.random();
  return r < 0.5 ? "fact" : r < 0.75 ? "n2s" : "s2n";
}
function qStat(id) { return S.q[id] || {n: 0, ok: 0}; }
function missOf(id) { const s = qStat(id); return s.n - s.ok; }
function buildSet(pool, n, kindPref, weak) {
  if (!pool.length) return [];
  const order = weak
    ? pool.slice().sort((a, b) => (missOf(b.id) - missOf(a.id)) || (qStat(a.id).n - qStat(b.id).n) || (Math.random() - .5))
    : shuffle(pool.slice());
  const out = [], used = new Set();
  for (let i = 0, tries = 0; out.length < n && tries < n * 30; tries++) {
    const q = makeQ(order[i % order.length], pickKind(kindPref));
    if (!used.has(q.key)) { used.add(q.key); out.push(q); i++; }
    else if (tries % 3 === 2) i++;
  }
  return out;
}
function recordQ(q, ok) {
  const s = S.q[q.id] || (S.q[q.id] = {n: 0, ok: 0});
  s.n++; if (ok) s.ok++; s.last = today();
}
function choicesHTML(q, act, sel, reveal) {
  return '<div class="choices">' + q.c.map((c, i) => {
    let cls = "";
    if (reveal) { if (i === q.a) cls = " ok"; else if (i === sel) cls = " ng"; }
    else if (i === sel) cls = " sel";
    return '<button class="choice' + cls + '" data-act="' + act + '" data-i="' + i + '"' + (reveal && act === "dans" ? " disabled" : "") + '><span class="n">' + (i + 1) + '</span><span>' + esc(c) + '</span></button>';
  }).join("") + '</div>';
}
function fieldOptions(withAll) {
  return (withAll ? '<option value="ALL">全分野をまぜる</option>' : '') + Object.entries(FIELDS).map(([k, f]) => '<option value="' + k + '">' + esc(f.label) + '</option>').join("");
}

// ---------- ドリル ----------
let DR = null;
function startDrill(list, opt) {
  if (!list) {
    opt = {field: $("#d-field").value, kind: $("#d-kind").value, order: $("#d-order").value, n: Number($("#d-count").value)};
    let pool = ITEMS.filter(it => opt.field === "ALL" || it.field === opt.field);
    if (opt.order === "learned") { const l = pool.filter(it => itemLevel(it) > 0); if (l.length) pool = l; }
    list = buildSet(pool, opt.n, opt.kind, opt.order === "weak");
  }
  if (!list.length) return;
  DR = {list: list, i: 0, ok: 0, answered: false, sel: -1, res: [], opt: opt || (DR && DR.opt)};
  VIEW = "drill"; render(); window.scrollTo(0, 0);
}
function answerDrill(i) {
  if (!DR || DR.done || DR.answered) return;
  const q = DR.list[DR.i], ok = i === q.a;
  DR.answered = true; DR.sel = i; if (ok) DR.ok++;
  DR.res.push({q: q, ok: ok}); recordQ(q, ok); save(); render();
}
function nextDrill() {
  if (!DR || DR.done || !DR.answered) return;
  DR.i++; DR.answered = false; DR.sel = -1;
  if (DR.i >= DR.list.length) {
    DR.done = true;
    S.drills.push({d: today(), n: DR.list.length, ok: DR.ok});
    if (S.drills.length > 300) S.drills.splice(0, S.drills.length - 300);
    save();
  }
  render(); window.scrollTo(0, 0);
}
function viewDrill() {
  let h = '<div class="row"><button class="btn-link" data-act="home">← ホーム</button></div>';
  if (!DR) {
    h += '<div class="box"><h2>ドリル</h2><p class="muted" style="margin-top:0">四択問題をその場で採点します。間違えた項目は記録され、「苦手を優先」で出し直せます。</p>';
    h += '<label class="muted">範囲</label><select id="d-field">' + fieldOptions(true) + '</select>';
    h += '<label class="muted" style="display:block;margin-top:10px">問題の形式</label><select id="d-kind"><option value="MIX">まぜる</option><option value="fact">要点（点数・基準・日数など）</option><option value="n2s">名称→説明</option><option value="s2n">説明→名称</option></select>';
    h += '<label class="muted" style="display:block;margin-top:10px">出し方</label><select id="d-order"><option value="random">ランダム</option><option value="weak">苦手を優先</option><option value="learned">一問一答で学習した項目から</option></select>';
    h += '<label class="muted" style="display:block;margin-top:10px">問題数</label><select id="d-count"><option selected>10</option><option>20</option><option>30</option></select>';
    h += '<p style="margin-top:14px"><button class="btn-main btn-big" data-act="drillstart">ドリルを始める</button></p></div>';
    return h;
  }
  if (DR.done) {
    const pc = pct(DR.ok, DR.list.length);
    const wrong = DR.res.filter(r => !r.ok);
    h += '<div class="box" style="text-align:center"><div class="muted">ドリルの結果</div><div class="big-score">' + DR.ok + '<span class="muted" style="font-size:18px"> / ' + DR.list.length + '</span></div><div class="' + (pc >= 80 ? 'okc' : 'ngc') + '">正答率 ' + pc + '%</div></div>';
    if (wrong.length) h += '<div class="box"><h2>間違えた問題</h2>' + wrong.map(r => '<div class="item" data-act="detail" data-id="' + r.q.id + '"><span>' + esc(BY_ID[r.q.id].name) + ' <span class="muted">' + KIND_LABEL[r.q.kind] + '</span></span><span class="badge">カード</span></div>').join("") + '</div>';
    h += '<div class="grid2">' + (wrong.length ? '<button class="btn-main" data-act="dretry">間違えた問題だけもう一度</button>' : '<span></span>') + '<button data-act="dagain">同じ設定でもう一度</button></div>';
    h += '<p><button class="btn-link" data-act="dsetup">設定に戻る</button></p>';
    return h;
  }
  const q = DR.list[DR.i];
  h = '<div class="progress"><button class="btn-link" data-act="dsetup">やめる</button><div class="bar"><i style="width:' + pct(DR.i, DR.list.length) + '%"></i></div><span>' + (DR.i + 1) + ' / ' + DR.list.length + '　正解 ' + DR.ok + '</span></div>';
  h += '<div class="card" style="min-height:auto"><div><span class="chip">' + esc(FIELDS[q.field].label) + '</span><span class="chip">' + KIND_LABEL[q.kind] + '</span></div>';
  h += '<div class="qtext">' + esc(q.q) + '</div>' + choicesHTML(q, "dans", DR.sel, DR.answered);
  if (DR.answered) h += '<div class="expl"><b class="' + (DR.sel === q.a ? 'okc">正解' : 'ngc">不正解') + '</b>\n' + esc(q.e) + '</div><p style="margin:6px 0 0"><button class="btn-link" data-act="detail" data-id="' + q.id + '">カードで詳しく見る</button></p>';
  h += '</div>';
  if (DR.answered) h += '<div class="reveal"><button class="btn-main btn-big" data-act="dnext">' + (DR.i + 1 < DR.list.length ? '次の問題' : '結果を見る') + '<span class="kbd" style="color:inherit;opacity:.8">Enter</span></button></div>';
  return h;
}

// ---------- 模擬試験 ----------
let EX = null, exTimer = null;
function startExam() {
  let list = [];
  for (const [k, n] of Object.entries(EXAM_N)) list = list.concat(buildSet(ITEMS.filter(it => it.field === k), n, "MIX", false));
  EX = {list: list, ans: list.map(() => -1), flag: list.map(() => false), i: 0, start: Date.now(), limit: $("#x-timer").checked ? EXAM_MIN * 60000 : 0};
  if (exTimer) clearInterval(exTimer);
  if (EX.limit) exTimer = setInterval(tickExam, 1000);
  VIEW = "exam"; render(); window.scrollTo(0, 0);
}
function leftText() {
  if (!EX || !EX.limit) return "時間制限なし";
  const left = Math.max(0, EX.limit - (Date.now() - EX.start));
  return "残り " + String(Math.floor(left / 60000)).padStart(2, "0") + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0");
}
function tickExam() {
  if (!EX || EX.done) { clearInterval(exTimer); return; }
  if (Date.now() - EX.start >= EX.limit) { finishExam(true); return; }
  const el = $("#x-time");
  if (el) { el.textContent = leftText(); el.classList.toggle("warn", EX.limit - (Date.now() - EX.start) < 5 * 60000); }
}
function finishExam(timeup) {
  if (!EX || EX.done) return;
  if (exTimer) clearInterval(exTimer);
  const per = {};
  Object.keys(EXAM_N).forEach(k => per[k] = {n: 0, ok: 0});
  let ok = 0;
  EX.list.forEach((q, i) => { const c = EX.ans[i] === q.a; if (c) ok++; per[q.field].n++; if (c) per[q.field].ok++; recordQ(q, c); });
  EX.done = true; EX.timeup = timeup; EX.score = ok; EX.review = "wrong";
  EX.sec = Math.round((Date.now() - EX.start) / 1000);
  S.exams.push({d: today(), score: ok, total: EX.list.length, pass: ok >= EXAM_PASS, per: per, sec: EX.sec});
  if (S.exams.length > 100) S.exams.splice(0, S.exams.length - 100);
  save(); VIEW = "exam"; render(); window.scrollTo(0, 0);
}
function viewExam() {
  let h = '<div class="row"><button class="btn-link" data-act="home">← ホーム</button></div>';
  if (!EX) {
    h += '<div class="box"><h2>模擬試験</h2><p class="muted" style="margin-top:0">全分野から' + EXAM_TOTAL + '問を出題します。合格ラインは80%（' + EXAM_PASS + '問）です。解答はすべて解き終えてから採点します。</p>';
    h += '<table><tr><th>分野</th><th class="n">出題数</th><th class="n">これまでの正答率</th></tr>' + Object.entries(EXAM_N).map(([k, n]) => {
      const st = ITEMS.filter(it => it.field === k).reduce((a, it) => { const s = qStat(it.id); a.n += s.n; a.ok += s.ok; return a; }, {n: 0, ok: 0});
      return '<tr><td>' + esc(FIELDS[k].label) + '</td><td class="n">' + n + '</td><td class="n">' + (st.n ? pct(st.ok, st.n) + '%' : '—') + '</td></tr>';
    }).join("") + '<tr><td><b>合計</b></td><td class="n"><b>' + EXAM_TOTAL + '</b></td><td></td></tr></table>';
    h += '<label class="opt"><input type="checkbox" id="x-timer" checked> 制限時間' + EXAM_MIN + '分</label>';
    h += '<p><button class="btn-main btn-big" data-act="exstart">模擬試験を始める</button></p></div>';
    if (S.exams.length) h += '<div class="box"><h2>これまでの結果</h2><table><tr><th>日付</th><th class="n">得点</th><th>判定</th></tr>' + S.exams.slice(-8).reverse().map(x => '<tr><td>' + md(x.d) + '</td><td class="n">' + x.score + ' / ' + x.total + '</td><td>' + (x.pass ? '<span class="okc">合格ライン到達</span>' : '<span class="ngc">あと' + (EXAM_PASS - x.score) + '問</span>') + '</td></tr>').join("") + '</table></div>';
    return h;
  }
  if (EX.done) {
    const pass = EX.score >= EXAM_PASS;
    h += '<div class="box" style="text-align:center">' + (EX.timeup ? '<div class="ngc">制限時間が終わりました</div>' : '') + '<div class="muted">模擬試験の結果</div><div class="big-score ' + (pass ? 'okc' : 'ngc') + '">' + EX.score + '<span class="muted" style="font-size:18px"> / ' + EX.list.length + '</span></div>';
    h += '<div>' + (pass ? '<b class="okc">合格ライン（80%）に到達</b>' : '合格ラインまであと<b class="ngc">' + (EXAM_PASS - EX.score) + '問</b>') + '</div><div class="muted">所要 ' + Math.max(1, Math.round(EX.sec / 60)) + '分</div></div>';
    h += '<div class="box"><h2>分野別の得点</h2>' + Object.keys(EXAM_N).map(k => {
      const p = EX.list.reduce((a, q, i) => { if (q.field === k) { a.n++; if (EX.ans[i] === q.a) a.ok++; } return a; }, {n: 0, ok: 0});
      return '<div class="fieldrow"><span>' + esc(FIELDS[k].label) + '</span><span class="muted" style="text-align:right">' + p.ok + '/' + p.n + '</span><div class="bar"><i class="' + (pct(p.ok, p.n) >= 80 ? 'ok' : '') + '" style="width:' + pct(p.ok, p.n) + '%"></i></div></div>';
    }).join("") + '</div>';
    h += '<div class="grid2"><button class="' + (EX.review === "wrong" ? 'btn-main' : '') + '" data-act="exrev" data-v="wrong">間違えた問題の解説</button><button class="' + (EX.review === "all" ? 'btn-main' : '') + '" data-act="exrev" data-v="all">全問の解説</button></div>';
    const rows = EX.list.map((q, i) => ({q: q, i: i, sel: EX.ans[i]})).filter(x => EX.review === "all" || x.sel !== x.q.a);
    h += rows.length ? rows.map(x => '<div class="box"><div><span class="chip ' + (x.sel === x.q.a ? '' : 'new') + '">第' + (x.i + 1) + '問 ' + (x.sel === x.q.a ? '正解' : (x.sel < 0 ? '未解答' : '不正解')) + '</span><span class="chip">' + esc(FIELDS[x.q.field].label) + '</span></div><div class="qtext" style="font-size:15px">' + esc(x.q.q) + '</div>' + choicesHTML(x.q, "noop", x.sel, true) + '<div class="expl">' + esc(x.q.e) + '</div><p style="margin:6px 0 0"><button class="btn-link" data-act="detail" data-id="' + x.q.id + '">カードで詳しく見る</button></p></div>').join("") : '<div class="box"><p class="muted">全問正解です。</p></div>';
    h += '<p><button class="btn-main btn-big" data-act="exretry">もう一度受験する</button></p>';
    return h;
  }
  const q = EX.list[EX.i], done = EX.ans.filter(a => a >= 0).length;
  h = '<div class="progress"><span>第' + (EX.i + 1) + '問 / ' + EX.list.length + '</span><div class="bar"><i style="width:' + pct(done, EX.list.length) + '%"></i></div><span class="timer" id="x-time">' + leftText() + '</span></div>';
  h += '<div class="card" style="min-height:auto"><div><span class="chip">' + esc(FIELDS[q.field].label) + '</span><span class="chip">' + KIND_LABEL[q.kind] + '</span></div>';
  h += '<div class="qtext">' + esc(q.q) + '</div>' + choicesHTML(q, "exsel", EX.ans[EX.i], false);
  h += '<label class="opt"><input type="checkbox" id="x-flag"' + (EX.flag[EX.i] ? ' checked' : '') + '> あとで見直す</label></div>';
  h += '<div class="grid2"><button data-act="exprev"' + (EX.i === 0 ? ' disabled' : '') + '>← 前の問題</button><button class="btn-main" data-act="exnext">' + (EX.i === EX.list.length - 1 ? '最初の問題へ' : '次の問題 →') + '</button></div>';
  h += '<div class="pal">' + EX.list.map((x, i) => '<button class="' + [EX.ans[i] >= 0 ? 'done' : '', EX.flag[i] ? 'flag' : '', i === EX.i ? 'cur' : ''].join(' ') + '" data-act="exjump" data-i="' + i + '">' + (i + 1) + '</button>').join("") + '</div>';
  h += '<p class="muted">解答済み ' + done + ' / ' + EX.list.length + '　枠が黄色の番号は「あとで見直す」</p>';
  h += '<p><button class="btn-big" data-act="exsubmit">採点する</button></p>';
  return h;
}
function handleQuizAct(a, el) {
  if (a === "drillstart") startDrill();
  else if (a === "dans") answerDrill(Number(el.dataset.i));
  else if (a === "dnext") nextDrill();
  else if (a === "dsetup") { DR = null; render(); }
  else if (a === "dquick") { const o = {field: "ALL", kind: "MIX", order: el.dataset.o, n: 10}; startDrill(buildSet(ITEMS, 10, "MIX", o.order === "weak"), o); }
  else if (a === "dretry") { const w = DR.res.filter(r => !r.ok).map(r => makeQ(BY_ID[r.q.id], r.q.kind)); startDrill(shuffle(w), DR.opt); }
  else if (a === "dagain") { const o = DR.opt; if (!o) { DR = null; render(); return true; } let pool = ITEMS.filter(it => o.field === "ALL" || it.field === o.field); if (o.order === "learned") { const l = pool.filter(it => itemLevel(it) > 0); if (l.length) pool = l; } startDrill(buildSet(pool, o.n, o.kind, o.order === "weak"), o); }
  else if (a === "exstart") startExam();
  else if (a === "exsel") { EX.ans[EX.i] = Number(el.dataset.i); render(); }
  else if (a === "exprev") { if (EX.i > 0) { EX.i--; render(); } }
  else if (a === "exnext") { EX.i = (EX.i + 1) % EX.list.length; render(); window.scrollTo(0, 0); }
  else if (a === "exjump") { EX.i = Number(el.dataset.i); render(); window.scrollTo(0, 0); }
  else if (a === "exsubmit") { const un = EX.ans.filter(x => x < 0).length; if (!un || confirm("未解答が" + un + "問あります。採点しますか？")) finishExam(false); }
  else if (a === "exrev") { EX.review = el.dataset.v; render(); }
  else if (a === "exretry") { EX = null; render(); window.scrollTo(0, 0); }
  else if (a === "noop") { }
  else return false;
  return true;
}

// ---------- 操作 ----------
let PREV = "home";
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (handleQuizAct(a, el)) return;
  if (a === "home") { SES = null; CMP = null; go("home"); }
  else if (a === "start") startStudy();
  else if (a === "show") { if (SES) { SES.shown = true; render(); } }
  else if (a === "grade") grade(Number(el.dataset.g));
  else if (a === "quit") quit();
  else if (a === "go") {
    PREV = "home"; CMP = null;
    if (el.dataset.v === "drill" && DR && DR.done) DR = null;
    if (el.dataset.v === "exam" && EX && EX.done) EX = null;
    go(el.dataset.v);
  }
  else if (a === "detail") { PREV = SES ? "home" : VIEW; SES = null; go("detail", el.dataset.id); }
  else if (a === "cmpdetail") { PREV = "compare"; go("detail", el.dataset.id); }
  else if (a === "back") go(PREV || "home");
  else if (a === "cmpshow") { CMP.shown = true; render(); }
  else if (a === "cmpnext") { const n = pairs().length; CMP = {i: n > 1 ? (CMP.i + 1 + Math.floor(Math.random() * (n - 1))) % n : 0, shown: false}; render(); window.scrollTo(0, 0); }
  else if (a === "teststart") startTest({field: $("#t-field").value, order: $("#t-order").value, kind: $("#t-kind").value, count: Number($("#t-count").value), learnedOnly: $("#t-learned").checked});
  else if (a === "savesettings") { S.settings.newPerDay = Number($("#s-new").value); S.settings.pointCards = $("#s-pt").checked; save(); go("home"); }
  else if (a === "export") {
    const blob = new Blob([JSON.stringify(S)], {type: "application/json"});
    const url = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = url; link.download = "shinryo100_記録_" + today() + ".json"; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  else if (a === "import") $("#imp").click();
  else if (a === "reset") { if (confirm("学習記録をすべて消します。元に戻せません。よろしいですか？")) { S = fresh(); save(); rebuildTestMiss(); go("home"); } }
});
document.addEventListener("change", e => {
  if (e.target.id === "x-flag" && EX && !EX.done) { EX.flag[EX.i] = e.target.checked; render(); return; }
  if (e.target.id !== "imp" || !e.target.files.length) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (s.v !== 1 || typeof s.cards !== "object") throw new Error("形式が違います");
      if (!confirm("いまの学習記録を、読み込んだ記録で置き換えます。よろしいですか？")) return;
      S = Object.assign(fresh(), s); save(); rebuildTestMiss(); alert("読み込みました。"); go("home");
    } catch (err) { alert("読み込めませんでした：" + err.message); }
  };
  r.readAsText(e.target.files[0]);
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { LISTQ = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (!SES && VIEW === "drill" && DR && !DR.done) {
    if (!DR.answered && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); answerDrill(Number(e.key) - 1); }
    else if (DR.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); nextDrill(); }
    return;
  }
  if (!SES && VIEW === "exam" && EX && !EX.done) {
    if (["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); EX.ans[EX.i] = Number(e.key) - 1; render(); }
    else if (e.key === "ArrowRight") { EX.i = (EX.i + 1) % EX.list.length; render(); }
    else if (e.key === "ArrowLeft" && EX.i > 0) { EX.i--; render(); }
    return;
  }
  if (!SES || SES.finished) return;
  if (!SES.shown && (e.key === " " || e.key === "Enter")) { e.preventDefault(); SES.shown = true; render(); }
  else if (SES.shown && ["1", "2", "3"].includes(e.key)) { e.preventDefault(); grade(Number(e.key)); }
});

// ---------- 起動 ----------
rebuildTestMiss();
$("#foot").innerHTML = "出典：厚生労働省の告示・通知・改定の概要資料（各カードに資料名・参照箇所・確認日を表示）。" + esc(META.basis) + "に基づく。学習用の要約であり、算定や届出の判断には必ず原典を確認してください。";
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
