<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--ink:#1f2328;--sub:#5b6470;--line:#dde2e8;
  --main:#0075C2;--main-ink:#ffffff;--accent:#009FB9;--soft:#e8f2fa;
  --ok:#00A73C;--mid:#C98A00;--ng:#E0524D;--chip:#eef1f5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171b;--card:#1d2126;--ink:#e8eaed;--sub:#a3abb5;--line:#323840;
    --main:#4aa3e0;--main-ink:#0b1520;--accent:#3cc3d8;--soft:#1f2e3b;
    --ok:#3cc56b;--mid:#e0a92e;--ng:#f07a75;--chip:#2a3038;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b;--card:#1d2126;--ink:#e8eaed;--sub:#a3abb5;--line:#323840;
  --main:#4aa3e0;--main-ink:#0b1520;--accent:#3cc3d8;--soft:#1f2e3b;
  --ok:#3cc56b;--mid:#e0a92e;--ng:#f07a75;--chip:#2a3038;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Sans","Yu Gothic UI","游ゴシック","Yu Gothic",Meiryo,Arial,sans-serif;line-height:1.65;font-size:16px;
  -webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
header.top h1{font-size:19px;margin:0;color:var(--main);letter-spacing:.02em}
header.top .ver{font-size:12px;color:var(--sub);text-align:right}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button:disabled{opacity:.45;cursor:default}
.btn-main{background:var(--main);color:var(--main-ink);border-color:var(--main);font-weight:700}
.btn-big{width:100%;font-size:18px;padding:16px}
.btn-link{border:none;background:none;color:var(--main);padding:6px 4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.box h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--main)}
.stat span{font-size:12px;color:var(--sub)}
.chip{display:inline-block;font-size:12px;background:var(--chip);color:var(--sub);border-radius:999px;padding:2px 10px;margin:0 4px 4px 0}
.chip.new{background:var(--accent);color:#fff}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.bar i.ok{background:var(--ok)}
.fieldrow{display:grid;grid-template-columns:1fr 3.5em;gap:2px 8px;align-items:center;font-size:13px;margin:8px 0}
.fieldrow .bar{grid-column:1 / 3;grid-row:2}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.nav button{padding:14px 8px}
/* 学習カード */
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.progress .bar{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin:12px 0;min-height:42vh;display:flex;flex-direction:column}
.card .ask{font-size:13px;color:var(--sub);margin-bottom:6px}
.card .front{font-size:23px;font-weight:700;line-height:1.5;margin:8px 0 4px}
.card .front.long{font-size:19px;font-weight:600}
.answer{border-top:2px solid var(--main);margin-top:14px;padding-top:12px}
.answer .main{font-size:19px;font-weight:700;color:var(--main);line-height:1.55}
.detail dt{font-size:12px;color:var(--sub);margin-top:12px;font-weight:700}
.detail dd{margin:2px 0 0}
.detail ul{margin:2px 0 0;padding-left:1.2em}
.detail li{margin:2px 0}
.pt{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.pt b{white-space:nowrap}
.src{font-size:12px;color:var(--sub)}
.src a{color:var(--main)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;bottom:0;margin-top:8px;padding:8px 0;background:var(--bg)}
.grades button{background:var(--card)}
.grades button{padding:14px 4px;font-weight:700;font-size:15px}
.g1{border-color:var(--ng);color:var(--ng)}
.g2{border-color:var(--mid);color:var(--mid)}
.g3{border-color:var(--ok);color:var(--ok)}
.reveal{position:sticky;bottom:8px;margin-top:8px}
.kbd{font-size:11px;color:var(--sub);font-weight:400;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600}
td.n{text-align:right}
input[type=search],select,input[type=number]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label.opt{display:flex;align-items:center;gap:8px;padding:8px 0}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.badge{font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--chip);color:var(--sub)}
.badge.l{background:var(--soft);color:var(--main)}
.badge.m{background:var(--ok);color:#fff}
.notice{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
footer{font-size:11px;color:var(--sub);margin-top:24px;line-height:1.6}
footer a{color:var(--sub)}
.pair{display:grid;grid-template-columns:1fr;gap:8px}
.pair .side{background:var(--soft);border-radius:12px;padding:12px}
.pair .side b{color:var(--main)}
@media (min-width:600px){.pair{grid-template-columns:1fr 1fr}}
</style>
</head>

（入院・外来）","aliases":["栄養指導","入院栄養指導","外来栄養指導"],"kubun":"B001の9・10","field":"GK","group":"外来・救急・その他","priority":"B","order":100,"summary":"医師の指示で、管理栄養士が具体的な献立などで患者に栄養指導を行ったときの評価","target":"厚生労働大臣が定める特別食が必要な患者など（入院・外来）","requirements":["医師の指示に基づき、管理栄養士が具体的な献立などによって指導すること","入院栄養食事指導料は入院中2回まで（初回と2回目で点数が違う）","外来栄養食事指導料は、対面か情報通信機器を使うかで点数が違う"],"points":[{"label":"入院栄養食事指導料1（初回）","value":260,"unit":"点","per":"1回"},{"label":"入院栄養食事指導料1（2回目）","value":200,"unit":"点","per":"1回"},{"label":"外来栄養食事指導料1（初回・対面）","value":260,"unit":"点","per":"1回"}],"similar":[{"id":"KS-017","diff":"栄養サポートチーム加算はチームによる栄養管理の評価。栄養食事指導料は管理栄養士による個別の指導の評価"}],"hook":"栄養指導＝初回260点、2回目以降200点","revNote":"","r8new":false,"sources":[{"src":"S01","loc":"B001の9・10","checked":"2026-11-10"}],"updated":"2026-11-10"}]};
const META = DATA.meta, ITEMS = DATA.items, SRC = DATA.sources;
const BY_ID = Object.fromEntries(ITEMS.map(x => [x.id, x]));
const FIELDS = META.fields;
const KEY = "shinryo100-v1";
const INTERVAL = [0, 1, 3, 7, 16, 35];   // 段階（box）ごとの次回までの日数
const MASTER_BOX = 4;                    // この段階以上を「定着」とみなす
const GRADE_LABEL = {1: "言えなかった", 2: "あいまい", 3: "言えた"};

// ---------- 保存 ----------
function fresh() {
  return {v: 1, settings: {newPerDay: 4, pointCards: false}, cards: {}, intro: {}, log: [], daily: {}, tests: []};
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    const s = JSON.parse(raw);
    return Object.assign(fresh(), s, {settings: Object.assign(fresh().settings, s.settings || {})});
  } catch (e) { return fresh(); }
}
let S = load();
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; alert("学習記録を保存できませんでした。プライベートブラウズを使っていないか確認してください。"); } }
}

// ---------- 日付 ----------
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); }
function md(s) { const [, m, d] = s.split("-"); return Number(m) + "/" + Number(d); }

// ---------- 小道具 ----------
const $ = sel => document.querySelector(sel);
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function itemOf(cid) { return BY_ID[cid.split(":")[0]]; }
function typeOf(cid) { return cid.split(":")[1]; }
function fmtPoint(p) {
  if (typeof p.value === "number") return p.value.toLocaleString() + (p.unit || "点");
  if (typeof p.min === "number") return p.min.toLocaleString() + "〜" + p.max.toLocaleString() + (p.unit || "点");
  return p.text || "";
}
function scaleNote(it) {
  const p = (it.points || []).find(p => typeof p.value === "number" && p.per === "1日につき");
  if (!p) return "";
  const yen = p.value * 10, year = yen * 50 * 0.9 * 365;
  return "1床1日 " + yen.toLocaleString() + "円。50床の病棟・稼働率90%なら年 約" + (year / 1e8).toFixed(1) + "億円（" + esc(p.label) + "のみの概算）";
}

// ---------- 項目の学習状況 ----------
function itemLevel(it) {
  const n = S.cards[it.id + ":N"], s = S.cards[it.id + ":S"];
  if (!n) return 0;                                   // 未学習
  if (n.box >= MASTER_BOX && s && s.box >= MASTER_BOX) return 2;   // 定着
  return 1;                                           // 学習中
}
const LEVEL_LABEL = ["未学習", "学習中", "定着"];

// 期限が来たカード。同じ項目のカードが複数あるときは、前回から一番間が空いたものだけを出す
// （名称→概要と概要→名称を同じ日に出すと、片方がもう片方の答えになってしまうため）。
function dueCards(day) {
  const best = {};
  for (const [cid, st] of Object.entries(S.cards)) {
    const it = itemOf(cid);
    if (!it) continue;                                // 廃止・未公開の項目
    if (typeOf(cid) === "P" && !S.settings.pointCards) continue;
    if (st.due > day) continue;
    const cur = best[it.id];
    const older = !cur || (st.last || "") < (S.cards[cur].last || "") || ((st.last || "") === (S.cards[cur].last || "") && typeOf(cid) === "S");
    if (older) best[it.id] = cid;
  }
  return Object.values(best);
}
function introducedOn(day) { return Object.values(S.intro).filter(d => d === day).length; }
function nextNewItems(day) {
  const room = Math.max(0, S.settings.newPerDay - introducedOn(day));
  return ITEMS.filter(it => !S.cards[it.id + ":N"]).slice(0, room);
}
function nextPointCards() {
  if (!S.settings.pointCards) return [];
  return ITEMS.filter(it => S.cards[it.id + ":N"] && S.cards[it.id + ":N"].box >= 2 && !S.cards[it.id + ":P"])
    .slice(0, 4).map(it => it.id + ":P");
}

// 復習カードをばらばらに並べ、新規カードを等間隔に差し込む。同じ項目のカードが続かないようにする。
function buildQueue() {
  const day = today();
  const rev = shuffle(dueCards(day));
  const fresh = nextNewItems(day).map(it => it.id + ":N").concat(nextPointCards());
  const q = rev.slice();
  if (fresh.length) {
    const step = Math.max(1, Math.floor((q.length + fresh.length) / fresh.length));
    fresh.forEach((cid, i) => q.splice(Math.min(q.length, i * step + Math.floor(step / 2)), 0, cid));
  }
  for (let i = 1; i < q.length; i++) {
    if (itemOf(q[i]).id === itemOf(q[i - 1]).id) {
      const j = q.findIndex((c, k) => k > i && itemOf(c).id !== itemOf(q[i - 1]).id);
      if (j > 0) [q[i], q[j]] = [q[j], q[i]];
    }
  }
  return q;
}

// ---------- セッション ----------
let SES = null;
function startStudy() {
  const q = buildQueue();
  if (!q.length) return render();
  SES = {mode: "study", queue: q, idx: 0, shown: false, t0: Date.now(), cardT0: Date.now(), res: [], again: {}, done: {}};
  render();
}
function startTest(opt) {
  let pool = ITEMS.filter(it => opt.field === "ALL" || it.field === opt.field);
  if (opt.learnedOnly) { const l = pool.filter(it => itemLevel(it) > 0); if (l.length) pool = l; }
  if (!pool.length) return;
  if (opt.order === "weak") {
    const score = it => { const n = S.cards[it.id + ":N"] || {}, s = S.cards[it.id + ":S"] || {}; return (n.lapses || 0) + (s.lapses || 0) + (testMiss[it.id] || 0) * 2 - (n.box || 0) * 0.1 + Math.random() * 0.5; };
    pool = pool.slice().sort((a, b) => score(b) - score(a));
  } else pool = shuffle(pool.slice());
  pool = pool.slice(0, opt.count);
  const q = pool.map(it => it.id + ":" + (opt.kind === "MIX" ? (Math.random() < .5 ? "N" : "S") : opt.kind));
  SES = {mode: "test", queue: q, idx: 0, shown: false, t0: Date.now(), cardT0: Date.now(), res: [], again: {}, done: {}, opt};
  render();
}
let testMiss = {};
function rebuildTestMiss() { testMiss = {}; for (const t of S.tests) for (const id of (t.miss || [])) testMiss[id] = (testMiss[id] || 0) + 1; }

function grade(g) {
  if (!SES || !SES.shown) return;
  const cid = SES.queue[SES.idx];
  const sec = Math.min(300, Math.round((Date.now() - SES.cardT0) / 1000));
  const day = today();
  SES.res.push({cid, g});
  if (SES.mode === "study") {
    const first = !SES.done[cid];
    if (first) {
      SES.done[cid] = true;
      const st = S.cards[cid];
      const isNew = !st;
      const c = st || {box: 0, reps: 0, lapses: 0};
      if (g === 3) c.box = Math.min(c.box + 1, 5);
      else if (g === 2) c.box = Math.max(c.box, 1);
      else { if (c.box >= 2) c.lapses++; c.box = 1; }
      c.reps++; c.last = day; c.due = addDays(day, INTERVAL[c.box]);
      S.cards[cid] = c;
      if (isNew && typeOf(cid) === "N") {
        const it = itemOf(cid);
        S.intro[it.id] = day;
        if (!S.cards[it.id + ":S"]) S.cards[it.id + ":S"] = {box: 0, reps: 0, lapses: 0, due: addDays(day, 1)};   // 逆向きのカードは翌日から
      }
      const dd = S.daily[day] || (S.daily[day] = {n: 0, ok: 0, new: 0, rev: 0, sec: 0});
      dd.n++; if (g === 3) dd.ok++; if (isNew) dd.new++; else dd.rev++; dd.sec += sec;
    }
    S.log.push([new Date().toISOString().slice(0, 19), cid, g, sec]);
    if (S.log.length > 20000) S.log.splice(0, S.log.length - 20000);
    if (g === 1 && (SES.again[cid] || 0) < 2) { SES.again[cid] = (SES.again[cid] || 0) + 1; SES.queue.push(cid); }
    save();
  }
  SES.idx++; SES.shown = false; SES.cardT0 = Date.now();
  if (SES.idx >= SES.queue.length) finish(); else render();
  window.scrollTo(0, 0);
}
function finish() {
  if (SES.mode === "test") {
    const first = {};
    for (const r of SES.res) if (!(r.cid in first)) first[r.cid] = r.g;
    const ok = Object.values(first).filter(g => g === 3).length;
    const miss = Object.entries(first).filter(([, g]) => g !== 3).map(([c]) => itemOf(c).id);
    S.tests.push({d: today(), n: Object.keys(first).length, ok, field: SES.opt.field, miss});
    if (S.tests.length > 200) S.tests.splice(0, S.tests.length - 200);
    rebuildTestMiss(); save();
  }
  SES.finished = true; render();
}
function quit() { if (SES && SES.mode === "study" && SES.res.length) { SES.finished = true; render(); } else { SES = null; render(); } }

function streak() {
  let d = today(), n = 0;
  if (!(S.daily[d] && S.daily[d].n)) d = addDays(d, -1);
  while (S.daily[d] && S.daily[d].n) { n++; d = addDays(d, -1); }
  return n;
}

function pairs() {
  const seen = new Set(), out = [];
  for (const it of ITEMS) for (const s of it.similar || []) {
    if (!BY_ID[s.id]) continue;
    const k = [it.id, s.id].sort().join("+");
    if (seen.has(k)) continue; seen.add(k); out.push(k.split("+"));
  }
  return out;
}

  h += '<div class="pair"><div class="side"><b>' + esc(a.name) + '</b><div class="muted">' + esc(a.kubun) + '</div></div><div class="side"><b>' + esc(b.name) + '</b><div class="muted">' + esc(b.kubun) + '</div></div></div>';
  if (CMP.shown) {
    h += '<div class="answer"><div class="pair"><div class="side"><b>' + esc(a.name) + '</b><div>' + esc(a.summary) + '</div></div><div class="side"><b>' + esc(b.name) + '</b><div>' + esc(b.summary) + '</div></div></div><dl class="detail"><dt>違い</dt><dd><ul>';
    const d1 = diff(a, b), d2 = diff(b, a);
    if (d1) h += '<li>' + esc(d1.diff) + '</li>';
    if (d2) h += '<li>' + esc(d2.diff) + '</li>';
    h += '</ul></dd></dl></div>';
  }
  h += '</div>';
  h += CMP.shown ? '<div class="grid2"><button data-act="cmpdetail" data-id="' + a.id + '">' + esc(a.name) + 'を詳しく</button><button data-act="cmpdetail" data-id="' + b.id + '">' + esc(b.name) + 'を詳しく</button></div><p><button class="btn-main btn-big" data-act="cmpnext">次の組合せ</button></p>' : '<div class="reveal"><button class="btn-main btn-big" data-act="cmpshow">違いを見る</button></div>';
  return h;
}

function viewTestSetup() {
  let h = '<div class="row"><button class="btn-link" data-act="home">← ホーム</button></div>';
  h += '<div class="box"><h2>理解度テスト</h2><p class="muted">復習の予定（間隔反復）には影響しません。間違えた項目は「復習が必要な項目」に出ます。</p>';
  h += '<label class="muted">範囲</label><select id="t-field"><option value="ALL">全分野をまぜる</option>' + Object.entries(FIELDS).filter(([k]) => ITEMS.some(it => it.field === k)).map(([k, f]) => '<option value="' + k + '">' + esc(f.label) + '</option>').join("") + '</select>';
  h += '<label class="muted" style="display:block;margin-top:10px">出し方</label><select id="t-order"><option value="random">ランダム</option><option value="weak">苦手な項目を優先</option></select>';
  h += '<label class="muted" style="display:block;margin-top:10px">形式</label><select id="t-kind"><option value="MIX">名称→概要と概要→名称をまぜる</option><option value="N">名称→概要</option><option value="S">概要→名称</option></select>';
  h += '<label class="muted" style="display:block;margin-top:10px">問題数</label><select id="t-count"><option>5</option><option selected>10</option><option>20</option><option value="999">すべて</option></select>';
  h += '<label class="opt"><input type="checkbox" id="t-learned" checked> 学習を始めた項目だけから出す</label>';
  h += '<p><button class="btn-main btn-big" data-act="teststart">テストを始める</button></p></div>';
  return h;
}

function viewSettings() {
  let h = '<div class="row"><button class="btn-link" data-act="home">← ホーム</button></div>';
  h += '<div class="box"><h2>学習の設定</h2>';
  h += '<label class="muted">1日に新しく覚える項目の数</label><select id="s-new">' + [1, 2, 3, 4, 5, 6, 8].map(n => '<option' + (n === S.settings.newPerDay ? ' selected' : '') + '>' + n + '</option>').join("") + '</select>';
  h += '<label class="opt"><input type="checkbox" id="s-pt"' + (S.settings.pointCards ? ' checked' : '') + '> 点数カードも出す（名称と概要がある程度定着した項目から順に）</label>';
  h += '<p><button data-act="savesettings">設定を保存</button></p></div>';
  h += '<div class="box"><h2>バックアップ・引き継ぎ</h2><p class="muted">学習記録はこの端末のこのブラウザの中だけに保存されています。PCとスマホで引き継ぐときや、念のための保存に使ってください。</p>';
  h += '<div class="row"><button data-act="export">記録を書き出す</button><button data-act="import">記録を読み込む</button><input type="file" id="imp" accept="application/json,.json" style="display:none"></div></div>';
  h += '<div class="box"><h2>リセット</h2><p class="muted">学習記録をすべて消します。元に戻せません。</p><button class="g1" data-act="reset">学習記録を消す</button></div>';
  h += '<div class="box"><h2>このアプリについて</h2><p class="muted">名称→概要、概要→名称の両方向で思い出す練習をし、思い出せた度合いに応じて次に出す日を決めます（1日→3日→7日→16日→35日。言えなかったカードは翌日に戻ります）。</p></div>';
  return h;
}

// ---------- 操作 ----------
let PREV = "home";
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (a === "home") { SES = null; CMP = null; go("home"); }
  else if (a === "start") startStudy();
  else if (a === "show") { if (SES) { SES.shown = true; render(); } }
  else if (a === "grade") grade(Number(el.dataset.g));
  else if (a === "quit") quit();
  else if (a === "go") { PREV = "home"; CMP = null; go(el.dataset.v); }
  else if (a === "detail") { PREV = SES ? "home" : VIEW; SES = null; go("detail", el.dataset.id); }
  else if (a === "cmpdetail") { PREV = "compare"; go("detail", el.dataset.id); }
  else if (a === "back") go(PREV || "home");
  else if (a === "cmpshow") { CMP.shown = true; render(); }
  else if (a === "cmpnext") { const n = pairs().length; CMP = {i: n > 1 ? (CMP.i + 1 + Math.floor(Math.random() * (n - 1))) % n : 0, shown: false}; render(); window.scrollTo(0, 0); }
  else if (a === "teststart") startTest({field: $("#t-field").value, order: $("#t-order").value, kind: $("#t-kind").value, count: Number($("#t-count").value), learnedOnly: $("#t-learned").checked});
  else if (a === "savesettings") { S.settings.newPerDay = Number($("#s-new").value); S.settings.pointCards = $("#s-pt").checked; save(); go("home"); }
  else if (a === "export") {
    const blob = new Blob([JSON.stringify(S)], {type: "application/json"});
    const url = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = url; link.download = "shinryo100_記録_" + today() + ".json"; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  else if (a === "import") $("#imp").click();
  else if (a === "reset") { if (confirm("学習記録をすべて消します。元に戻せません。よろしいですか？")) { S = fresh(); save(); rebuildTestMiss(); go("home"); } }
});
document.addEventListener("change", e => {
  if (e.target.id !== "imp" || !e.target.files.length) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (s.v !== 1 || typeof s.cards !== "object") throw new Error("形式が違います");
      if (!confirm("いまの学習記録を、読み込んだ記録で置き換えます。よろしいですか？")) return;
      S = Object.assign(fresh(), s); save(); rebuildTestMiss(); alert("読み込みました。"); go("home");
    } catch (err) { alert("読み込めませんでした：" + err.message); }
  };
  r.readAsText(e.target.files[0]);
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { LISTQ = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", e => {
  if (!SES || SES.finished || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (!SES.shown && (e.key === " " || e.key === "Enter")) { e.preventDefault(); SES.shown = true; render(); }
  else if (SES.shown && ["1", "2", "3"].includes(e.key)) { e.preventDefault(); grade(Number(e.key)); }
});

// ---------- 起動 ----------
rebuildTestMiss();
$("#foot").innerHTML = "出典：厚生労働省の告示・通知・改定の概要資料（各カードに資料名・参照箇所・確認日を表示）。" + esc(META.basis) + "に基づく。学習用の要約であり、算定や届出の判断には必ず原典を確認してください。";
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
